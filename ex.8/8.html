
<!DOCTYPE html>
<html lang="en" ng-app="myApp">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AngularJS Practical</title>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
<style>
body{font-family:Arial;background:#eef2ff;color:#1e293b;margin:15px}
h1{text-align:center;color:#4338ca}
section{background:white;padding:14px;margin:12px auto;max-width:650px;border-radius:10px}
input,textarea,select,button{padding:8px;margin:5px;border:1px solid #aaa;border-radius:5px}
button{background:#4338ca;color:white;cursor:pointer}
li{margin:8px}
</style>
</head>
<body>

<h1>AngularJS Applications</h1>

<!-- 1. Hello World -->
<section ng-controller="HelloWorldCtrl">
<h3>1. Hello World</h3>
<h2>{{message}}</h2>
</section>

<!-- 2. Comment Box -->
<section ng-controller="CommentCtrl">
<h3>2. Comment Box</h3>
<textarea ng-model="newComment" placeholder="Write your comment"></textarea><br>
<button ng-click="addComment()">Post Comment</button>
<ul>
<li ng-repeat="c in comments track by $index">
{{c}} <button ng-click="removeComment($index)">X</button>
</li>
</ul>
</section>

<!-- 3. Calculator -->
<section ng-controller="CalculatorCtrl">
<h3>3. Simple Calculator</h3>
<input type="number" ng-model="a" placeholder="Number 1">
<select ng-model="operator">
<option value="+">+</option>
<option value="-">-</option>
<option value="*">*</option>
<option value="/">/</option>
</select>
<input type="number" ng-model="b" placeholder="Number 2">
<h3>Result: {{calculate()}}</h3>
</section>

<!-- 4. To-Do List -->
<section ng-controller="TodoCtrl">
<h3>4. To-Do List</h3>
<input ng-model="taskTitle" placeholder="Enter a task">
<button ng-click="addTask()">Add Task</button>
<ul>
<li ng-repeat="t in tasks track by $index">
{{t}} <button ng-click="removeTask($index)">Delete</button>
</li>
</ul>
</section>

<script>
var app = angular.module("myApp", []);

// 1. Hello World Controller
app.controller("HelloWorldCtrl", function($scope) {
  $scope.message = "Hello World!";
});

// 2. Comment Box Controller
app.controller("CommentCtrl", function($scope) {
  $scope.comments = [];
  $scope.addComment = function() {
    if ($scope.newComment && $scope.newComment.trim() !== "") {
      $scope.comments.push($scope.newComment.trim());
      $scope.newComment = "";
    }
  };
  $scope.removeComment = function(index) {
    $scope.comments.splice(index, 1);
  };
});

// 3. Calculator Controller
app.controller("CalculatorCtrl", function($scope) {
  $scope.a = 0;
  $scope.b = 0;
  $scope.operator = "+";

  $scope.calculate = function() {
    var a = Number($scope.a);
    var b = Number($scope.b);

    if ($scope.operator === "+") return a + b;
    if ($scope.operator === "-") return a - b;
    if ($scope.operator === "*") return a * b;
    if ($scope.operator === "/") {
      return b === 0 ? "Cannot divide by zero" : a / b;
    }
  };
});

// 4. To-Do List Controller
app.controller("TodoCtrl", function($scope) {
  $scope.tasks = [];
  $scope.addTask = function() {
    if ($scope.taskTitle && $scope.taskTitle.trim() !== "") {
      $scope.tasks.push($scope.taskTitle.trim());
      $scope.taskTitle = "";
    }
  };
  $scope.removeTask = function(index) {
    $scope.tasks.splice(index, 1);
  };
});
</script>

</body>
</html>
