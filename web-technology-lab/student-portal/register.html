
<h2>Student Registration</h2>
<form name="studentForm" ng-submit="submitted=true" novalidate>
<label>Full Name</label>
<input ng-model="student.name" required placeholder="Enter your name">
<label>Email</label>
<input type="email" ng-model="student.email" required placeholder="Enter your email">
<label>Choose Course</label>
<select ng-model="student.course" required>
<option value="">Select a course</option>
<option>Web Development</option>
<option>Artificial Intelligence</option>
<option>Python Programming</option>
</select>
<button type="submit" ng-disabled="studentForm.$invalid">Register</button>
<p ng-if="submitted">Thank you, {{student.name}}! Your details have been submitted.</p>
</form>
