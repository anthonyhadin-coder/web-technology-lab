
<!DOCTYPE html>
<html lang="en" ng-app="portalApp">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Portal</title>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.min.js"></script>
<style>
body{font-family:Arial;margin:0;background:#f1f5f9;color:#1e293b}
header{background:#4338ca;color:white;text-align:center;padding:20px}
nav{background:#312e81;padding:14px;text-align:center}
nav a{color:white;text-decoration:none;margin:12px;font-weight:bold}
main{background:white;max-width:750px;margin:25px auto;padding:22px;border-radius:12px}
h2{color:#4338ca}
input,textarea,button{padding:10px;margin:7px 0;max-width:100%;box-sizing:border-box}
input,textarea{width:100%}
button{background:#4338ca;color:white;border:0;border-radius:5px;cursor:pointer}
footer{text-align:center;padding:15px}
</style>
</head>
<body>
<header>
<h1>Student Portal</h1>
<p>Learn, Grow and Achieve</p>
</header>
<nav>
<a href="#!/">Home</a>
<a href="#!/courses">Courses</a>
<a href="#!/register">Register</a>
<a href="#!/contact">Contact</a>
</nav>
<main ng-view></main>
<footer>Student Portal | AngularJS SPA</footer>

<script>
angular.module("portalApp",["ngRoute"])
.config(function($routeProvider){
$routeProvider
.when("/",{templateUrl:"home.html"})
.when("/courses",{templateUrl:"courses.html"})
.when("/register",{templateUrl:"register.html"})
.when("/contact",{templateUrl:"contact.html"})
.otherwise({redirectTo:"/"});
});
</script>
</body>
</html>
