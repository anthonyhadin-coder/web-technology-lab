<!DOCTYPE html>
<html lang="en" ng-app="webTechApp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiment 9 - Form Validation and Routing</title>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular-route.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f1f5f9; color: #1e293b; }
    header { background: #172554; color: white; padding: 24px 20px; text-align: center; position: relative; }
    header h1 { margin: 0 0 10px; }
    header p { margin: 5px; }
    .student-info { position: absolute; top: 12px; right: 18px; text-align: right; font-size: 12px; line-height: 1.6; }
    nav { background: #1e40af; display: flex; justify-content: center; flex-wrap: wrap; gap: 5px; padding: 12px; }
    nav a { color: white; text-decoration: none; padding: 10px 16px; border-radius: 6px; }
    nav a:hover, nav a.active { background: #3b82f6; }
    .container { max-width: 950px; margin: 25px auto; padding: 0 18px; min-height: 450px; }
    .card { background: white; padding: 25px; margin-bottom: 22px; border-radius: 12px; box-shadow: 0 4px 15px #00000012; }
    h2 { color: #1d4ed8; margin-top: 0; border-bottom: 2px solid #dbeafe; padding-bottom: 12px; }
    h3 { color: #334155; }
    label { display: block; margin: 13px 0 6px; font-weight: bold; font-size: 14px; }
    input:not([type="radio"]), select, textarea { width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; font-family: inherit; }
    textarea { min-height: 90px; resize: vertical; }
    input:focus, select:focus, textarea:focus { outline: 2px solid #bfdbfe; border-color: #2563eb; }
    .radio-group { display: flex; align-items: center; gap: 18px; margin-top: 8px; }
    .radio-group label { font-weight: normal; margin: 0; }
    .radio-group input { margin-right: 5px; }
    .error { display: block; color: #dc2626; font-size: 13px; margin-top: 5px; }
    .invalid { border: 1px solid #dc2626 !important; }
    .required { color: #dc2626; }
    button, .action-link { display: inline-block; background: #2563eb; color: white; padding: 11px 18px; border: none; border-radius: 6px; margin-top: 18px; text-decoration: none; cursor: pointer; font-size: 14px; }
    button:hover, .action-link:hover { background: #1e40af; }
    button:disabled { background: #cbd5e1; color: #64748b; cursor: not-allowed; }
    .success { background: #dcfce7; color: #166534; padding: 14px; border-radius: 6px; margin-top: 18px; }
    .hero { background: #eff6ff; padding: 25px; border-radius: 10px; line-height: 1.8; }
    .feature-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .feature { background: #f8fafc; padding: 18px; border-radius: 8px; border: 1px solid #e2e8f0; }
    .result { background: #f8fafc; padding: 18px; border-radius: 8px; border: 1px solid #e2e8f0; }
    footer { background: #172554; color: white; text-align: center; padding: 20px; }
    @media (max-width: 600px) {
      .student-info { position: static; text-align: center; margin-bottom: 12px; }
      .feature-grid { grid-template-columns: 1fr; }
      .card { padding: 17px; }
    }
  </style>
</head>
<body>
<header>
  <div class="student-info"><strong>ANTHONY HADIN</strong><br>URK24CS9018</div>
  <h1>WEB TECHNOLOGY LAB</h1>
  <p>Experiment No. 09</p>
  <p><strong>Form Validation and Routing Using AngularJS</strong></p>
</header>

<nav>
  <a href="#!/home" ng-class="{active: $location.path() === '/home' || $location.path() === '/'}">Home</a>
  <a href="#!/register" ng-class="{active: $location.path() === '/register'}">Registration</a>
  <a href="#!/courses" ng-class="{active: $location.path() === '/courses'}">Courses</a>
  <a href="#!/contact" ng-class="{active: $location.path() === '/contact'}">Contact</a>
</nav>

<div class="container"><div ng-view></div></div>

<footer>
  <p>Experiment No. 09 - AngularJS</p>
  <p>Anthony Hadin | URK24CS9018</p>
</footer>

<script type="text/ng-template" id="home.html">
  <section class="card">
    <h2>Welcome to Student Portal</h2>
    <div class="hero">
      <h3>Learn. Register. Grow.</h3>
      <p>Welcome to the Student Portal, a sample website developed using HTML, CSS and AngularJS.</p>
      <p>This website demonstrates client-side form validation and single-page application routing.</p>
      <a class="action-link" href="#!/register">Register Now</a>
    </div>
    <h3>Portal Features</h3>
    <div class="feature-grid">
      <div class="feature"><h3>User Registration</h3><p>Register using a form with field validation.</p></div>
      <div class="feature"><h3>Course Information</h3><p>Explore the courses available on the portal.</p></div>
      <div class="feature"><h3>AngularJS Routing</h3><p>Navigate between pages without reloading the entire application.</p></div>
      <div class="feature"><h3>Contact Information</h3><p>View the portal's contact details.</p></div>
    </div>
  </section>
</script>

<script type="text/ng-template" id="register.html">
  <section class="card" ng-controller="RegisterController">
    <h2>User Registration Form</h2>
    <p>All fields are mandatory. Enter valid details to enable the Submit button.</p>
    <form name="regForm" ng-submit="submitForm()" novalidate>
      <label for="name">Name <span class="required">*</span></label>
      <input type="text" id="name" name="name" ng-model="user.name" ng-pattern="/^[A-Za-z ]+$/" ng-required="true"
             ng-class="{'invalid': regForm.name.$touched && regForm.name.$invalid}" placeholder="Enter your full name">
      <span class="error" ng-if="regForm.name.$touched && regForm.name.$error.required">Name is required.</span>
      <span class="error" ng-if="regForm.name.$touched && regForm.name.$error.pattern">Name must contain letters and spaces only.</span>

      <label for="password">Password <span class="required">*</span></label>
      <input type="password" id="password" name="password" ng-model="user.password"
             ng-pattern="/^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,}$/"
             ng-required="true" ng-class="{'invalid': regForm.password.$touched && regForm.password.$invalid}"
             placeholder="Enter a strong password">
      <span class="error" ng-if="regForm.password.$touched && regForm.password.$error.required">Password is required.</span>
      <span class="error" ng-if="regForm.password.$touched && regForm.password.$error.pattern">Password must contain uppercase, lowercase, a number and at least 8 characters.</span>

      <label for="age">Age <span class="required">*</span></label>
      <input type="number" id="age" name="age" ng-model="user.age" ng-required="true" min="18" max="30" step="1"
             ng-class="{'invalid': regForm.age.$touched && regForm.age.$invalid}" placeholder="Enter age (18-30)">
      <span class="error" ng-if="regForm.age.$touched && regForm.age.$error.required">Age is required.</span>
      <span class="error" ng-if="regForm.age.$touched && (regForm.age.$error.min || regForm.age.$error.max || regForm.age.$error.number || regForm.age.$error.step)">Age must be a whole number between 18 and 30.</span>

      <label for="mobile">Mobile Number <span class="required">*</span></label>
      <input type="text" id="mobile" name="mobile" ng-model="user.mobile" ng-pattern="/^[0-9]{10}$/"
             ng-required="true" ng-class="{'invalid': regForm.mobile.$touched && regForm.mobile.$invalid}"
             maxlength="10" placeholder="Enter 10-digit mobile number">
      <span class="error" ng-if="regForm.mobile.$touched && regForm.mobile.$error.required">Mobile number is required.</span>
      <span class="error" ng-if="regForm.mobile.$touched && regForm.mobile.$error.pattern">Mobile number must contain exactly 10 digits.</span>

      <label for="email">Email <span class="required">*</span></label>
      <input type="email" id="email" name="email" ng-model="user.email" ng-required="true"
             ng-class="{'invalid': regForm.email.$touched && regForm.email.$invalid}" placeholder="example@email.com">
      <span class="error" ng-if="regForm.email.$touched && regForm.email.$error.required">Email is required.</span>
      <span class="error" ng-if="regForm.email.$touched && regForm.email.$error.email">Please enter a valid email address.</span>

      <label>Gender <span class="required">*</span></label>
      <div class="radio-group">
        <label><input type="radio" name="gender" ng-model="user.gender" value="Male" ng-required="true"> Male</label>
        <label><input type="radio" name="gender" ng-model="user.gender" value="Female" ng-required="true"> Female</label>
      </div>
      <span class="error" ng-if="regForm.gender.$touched && regForm.gender.$error.required">Please select a gender.</span>

      <label for="state">State <span class="required">*</span></label>
      <select id="state" name="state" ng-model="user.state" ng-required="true">
        <option value="">-- Select State --</option>
        <option value="Tamil Nadu">Tamil Nadu</option>
        <option value="Kerala">Kerala</option>
        <option value="Karnataka">Karnataka</option>
        <option value="Andhra Pradesh">Andhra Pradesh</option>
        <option value="Telangana">Telangana</option>
        <option value="Maharashtra">Maharashtra</option>
        <option value="Other">Other</option>
      </select>
      <span class="error" ng-if="regForm.state.$touched && regForm.state.$error.required">Please select a state.</span>

      <button type="submit" ng-disabled="regForm.$invalid">Submit Registration</button>
      <button type="button" ng-click="resetForm(regForm)" style="background:#64748b">Reset</button>

      <div class="success" ng-if="submitted">
        <strong>Registration Successful!</strong>
        <p>Name: {{ user.name }}</p><p>Email: {{ user.email }}</p><p>Age: {{ user.age }}</p>
        <p>Mobile: {{ user.mobile }}</p><p>Gender: {{ user.gender }}</p><p>State: {{ user.state }}</p>
      </div>
    </form>
  </section>
</script>

<script type="text/ng-template" id="courses.html">
  <section class="card">
    <h2>Courses Offered</h2>
    <p>Explore the following sample courses on our student portal.</p>
    <div class="feature-grid">
      <div class="feature"><h3>Computer Science</h3><p>Programming, algorithms and software development.</p></div>
      <div class="feature"><h3>Artificial Intelligence</h3><p>Machine learning, intelligent systems and data analysis.</p></div>
      <div class="feature"><h3>Web Development</h3><p>HTML, CSS, JavaScript and web application development.</p></div>
      <div class="feature"><h3>Database Management</h3><p>Database design, SQL and data management.</p></div>
    </div>
    <a class="action-link" href="#!/register">Register Here</a>
  </section>
</script>

<script type="text/ng-template" id="contact.html">
  <section class="card">
    <h2>Contact Us</h2>
    <p>For information about the Student Portal, refer to the details below.</p>
    <div class="result">
      <h3>Student Portal Support</h3>
      <p><strong>Email:</strong> support@example.com</p>
      <p><strong>Department:</strong> Computer Science</p>
      <p><strong>Service:</strong> Registration and course information</p>
    </div>
    <h3>Send an Enquiry</h3>
    <form name="contactForm" ng-submit="enquirySent = true">
      <label for="contactName">Your Name</label>
      <input id="contactName" type="text" ng-model="contactName" required>
      <label for="contactEmail">Your Email</label>
      <input id="contactEmail" type="email" ng-model="contactEmail" required>
      <label for="message">Message</label>
      <textarea id="message" ng-model="message" required></textarea>
      <button type="submit">Send Enquiry</button>
    </form>
    <div class="success" ng-if="enquirySent">Enquiry submitted successfully for this demonstration.</div>
  </section>
</script>

<script>
  var app = angular.module("webTechApp", ["ngRoute"]);

  app.run(function($rootScope, $location) {
    $rootScope.$location = $location;
  });

  app.config(function($routeProvider) {
    $routeProvider
      .when("/", { templateUrl: "home.html" })
      .when("/home", { templateUrl: "home.html" })
      .when("/register", { templateUrl: "register.html" })
      .when("/courses", { templateUrl: "courses.html" })
      .when("/contact", { templateUrl: "contact.html" })
      .otherwise({ redirectTo: "/home" });
  });

  app.controller("RegisterController", function($scope) {
    $scope.user = {};
    $scope.submitted = false;

    $scope.submitForm = function() {
      if ($scope.regForm.$valid) $scope.submitted = true;
    };

    $scope.resetForm = function(form) {
      $scope.user = {};
      $scope.submitted = false;
      if (form) {
        form.$setPristine();
        form.$setUntouched();
      }
    };
  });
</script>
</body>
</html>
